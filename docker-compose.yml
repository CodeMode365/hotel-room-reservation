services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hotel}
      MYSQL_USER: ${DB_USER:-hotel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hotel}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306" # so `python app.py` on the host can reach it too (3306 often taken by a local mysql/mariadb)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-hotel}
      DB_USER: ${DB_USER:-hotel}
      DB_PASSWORD: ${DB_PASSWORD:-hotel}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
